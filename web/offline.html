<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="theme-color" content="#FF8F00">
	<title>Offline — LetterBox</title>
	<style>
		html, body {
			margin: 0; padding: 0; height: 100%;
			background: #FFF8E1; color: #3c3222;
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
		}
		.wrap {
			display: flex; flex-direction: column; align-items: center;
			justify-content: center; height: 100%; padding: 2rem; text-align: center;
		}
		/* 2x2 letter tiles, like the game */
		.tiles {
			display: grid; grid-template-columns: 1fr 1fr;
			gap: 10px; margin-bottom: 1.5rem; width: 180px;
		}
		.tile {
			aspect-ratio: 1; border-radius: 18px;
			display: flex; align-items: center; justify-content: center;
			font-size: 2.4rem; font-weight: 700; user-select: none;
			background: #5C6B7D; color: #E9EDF1;
		}
		.tile.unknown { background: #7A8EA3; }
		.tile.accent  { background: #FF8F00; color: #fff; }
		h1 { font-size: 1.3rem; font-weight: 500; margin: 0 0 0.5rem; }
		p  { color: #8a7a5c; margin: 0; }
		a  { color: #E65100; text-decoration: none; font-weight: 600; }
	</style>
</head>
<body>
	<div class="wrap">
		<div class="tiles">
			<div class="tile">A</div>
			<div class="tile accent">B</div>
			<div class="tile">C</div>
			<div class="tile unknown">?</div>
		</div>
		<h1>No connection</h1>
		<p>LetterBox can't reach the network right now. Check your internet connection and <a href="/">try again</a>.</p>
	</div>
</body>
</html>
