image: cimg/android:2026.08.1

variables:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"
  DEBUG_APK: app/build/outputs/apk/debug/app-debug.apk
  RELEASE_APK: app/build/outputs/apk/release/app-release-unsigned.apk

cache:
  key: ${CI_PROJECT_ID}
  paths:
    - .gradle/wrapper
    - .gradle/caches

stages:
  - build
  - test
  - release

before_script:
  - sudo apt-get update || apt-get update
  - sudo apt-get install -y librsvg2-bin graphicsmagick-imagemagick-compat || apt-get install -y librsvg2-bin graphicsmagick-imagemagick-compat
  - export GRADLE_USER_HOME=$(pwd)/.gradle
  - sudo chmod +x ./gradlew || chmod +x ./gradlew

# Build debug APK
build_debug:
  stage: build
  script:
    - make
    - ./gradlew assembleDebug
    - sha256sum "$DEBUG_APK" | tee SHA256SUMS.debug
  artifacts:
    paths:
      - app/build/outputs/apk/debug/app-debug.apk
      - SHA256SUMS.debug
    expire_in: 4 weeks

# Build release APK (mirrors F-Droid's exact assembleRelease build)
build_release:
  stage: build
  script:
    - make
    - ./gradlew assembleRelease
    - sha256sum "$RELEASE_APK" | tee SHA256SUMS.release
  artifacts:
    paths:
      - app/build/outputs/apk/release/app-release-unsigned.apk
      - SHA256SUMS.release
    expire_in: 4 weeks

test:
  stage: test
  script:
    - ./gradlew test

# Publish a GitLab Release on every version tag (e.g. 0.1.1)
# Uploads the APKs and SHA256 checksums to the Package Registry for a
# permanent, immutable URL — enabling binary transparency.
release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  before_script: []
  cache: {}
  rules:
    - if: '$CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+/'
  needs:
    - job: build_debug
      artifacts: true
    - job: build_release
      artifacts: true
  script:
    - apk add --no-cache curl

    # Upload debug APK & checksum to Package Registry
    - |
      curl --fail --silent --show-error \
           --header "JOB-TOKEN: $CI_JOB_TOKEN" \
           --upload-file "$DEBUG_APK" \
           "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/letterbox/${CI_COMMIT_TAG}/app-debug.apk"
    - |
      curl --fail --silent --show-error \
           --header "JOB-TOKEN: $CI_JOB_TOKEN" \
           --upload-file SHA256SUMS.debug \
           "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/letterbox/${CI_COMMIT_TAG}/SHA256SUMS.debug"

    # Upload release unsigned APK & checksum to Package Registry
    - |
      curl --fail --silent --show-error \
           --header "JOB-TOKEN: $CI_JOB_TOKEN" \
           --upload-file "$RELEASE_APK" \
           "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/letterbox/${CI_COMMIT_TAG}/app-release-unsigned.apk"
    - |
      curl --fail --silent --show-error \
           --header "JOB-TOKEN: $CI_JOB_TOKEN" \
           --upload-file SHA256SUMS.release \
           "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/letterbox/${CI_COMMIT_TAG}/SHA256SUMS.release"

    # Combine checksums for release note
    - DEBUG_SHA=$(awk '{print $1}' SHA256SUMS.debug)
    - RELEASE_SHA=$(awk '{print $1}' SHA256SUMS.release)
    - DEBUG_APK_URL="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/letterbox/${CI_COMMIT_TAG}/app-debug.apk"
    - RELEASE_APK_URL="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/letterbox/${CI_COMMIT_TAG}/app-release-unsigned.apk"
    - DEBUG_SUMS_URL="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/letterbox/${CI_COMMIT_TAG}/SHA256SUMS.debug"
    - RELEASE_SUMS_URL="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/letterbox/${CI_COMMIT_TAG}/SHA256SUMS.release"

    - |
      cat > release-notes.md << NOTES
      ## LetterBox ${CI_COMMIT_TAG}

      A children's game to learn the letters of the alphabet.

      ### 🔐 Binary Transparency

      These APKs were built by GitLab CI directly from tag \`${CI_COMMIT_TAG}\`
      (pipeline [#${CI_PIPELINE_ID}](${CI_PROJECT_URL}/-/pipelines/${CI_PIPELINE_ID})).

      **Release APK (unsigned):**
      \`\`\`
      ${RELEASE_SHA}  app-release-unsigned.apk
      \`\`\`

      **Debug APK:**
      \`\`\`
      ${DEBUG_SHA}  app-debug.apk
      \`\`\`
      NOTES

    # Create the release
    - |
      release-cli create \
        --name "LetterBox ${CI_COMMIT_TAG}" \
        --tag-name "${CI_COMMIT_TAG}" \
        --description release-notes.md \
        --assets-link "{\"name\":\"app-release-unsigned.apk\",\"url\":\"${RELEASE_APK_URL}\",\"link_type\":\"package\"}" \
        --assets-link "{\"name\":\"app-debug.apk\",\"url\":\"${DEBUG_APK_URL}\",\"link_type\":\"package\"}" \
        --assets-link "{\"name\":\"SHA256SUMS.release\",\"url\":\"${RELEASE_SUMS_URL}\",\"link_type\":\"other\"}" \
        --assets-link "{\"name\":\"SHA256SUMS.debug\",\"url\":\"${DEBUG_SUMS_URL}\",\"link_type\":\"other\"}"
