image: cimg/android:2026.08.1

variables:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"
  DEBUG_APK: app/build/outputs/apk/debug/app-debug.apk
  RELEASE_APK: app/build/outputs/apk/release/app-release-unsigned.apk

cache:
  key: ${CI_PROJECT_ID}
  paths:
    - .gradle/wrapper
    - .gradle/caches

stages:
  - build
  - test
  - release

before_script:
  - sudo apt-get update || apt-get update
  - sudo apt-get install -y librsvg2-bin graphicsmagick-imagemagick-compat || apt-get install -y librsvg2-bin graphicsmagick-imagemagick-compat
  - export GRADLE_USER_HOME=$(pwd)/.gradle
  - sudo chmod +x ./gradlew || chmod +x ./gradlew

# Build debug APK
build_debug:
  stage: build
  script:
    - make
    - ./gradlew assembleDebug
    - sha256sum "$DEBUG_APK" | tee SHA256SUMS.debug
  artifacts:
    paths:
      - app/build/outputs/apk/debug/app-debug.apk
      - SHA256SUMS.debug
    expire_in: 4 weeks

# Build release APK (mirrors F-Droid's exact assembleRelease build)
build_release:
  stage: build
  script:
    - make
    - ./gradlew assembleRelease
    - sha256sum "$RELEASE_APK" | tee SHA256SUMS.release
  artifacts:
    paths:
      - app/build/outputs/apk/release/app-release-unsigned.apk
      - SHA256SUMS.release
    expire_in: 4 weeks

test:
  stage: test
  script:
    - ./gradlew test

# Publish a GitLab Release: automatically on every version tag (e.g.
# 0.1.1), or on demand via CI/CD > Pipelines > "Run pipeline" on master --
# GitLab's equivalent of a manual workflow_dispatch button, so this job
# does not appear (and can't be clicked) on ordinary push pipelines.
# CI_JOB_TOKEN cannot do a plain `git push` (GitLab rejects it: "You are
# not allowed to push code to this project"), so the on-demand path never
# pushes a tag itself -- it hands release-cli a --ref instead, and the
# Releases API (which does accept CI_JOB_TOKEN) creates the tag for us.
# Uploads the APKs and SHA256 checksums to the Package Registry for a
# permanent, immutable URL — enabling binary transparency.
release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  before_script: []
  cache: {}
  rules:
    - if: '$CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+/'
    - if: '$CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH == "master"'
      when: manual
  needs:
    - job: build_debug
      artifacts: true
    - job: build_release
      artifacts: true
  script:
    - apk add --no-cache curl git grep

    # On a tag pipeline VERSION is that tag; on demand it's read from source.
    - VERSION="${CI_COMMIT_TAG:-$(grep -oP 'versionName\s+"\K[^"]+' app/build.gradle)}"
    - VERSION_CODE=$(grep -oP 'versionCode\s+\K\d+' app/build.gradle)
    - echo "Releasing $VERSION (versionCode=$VERSION_CODE)"

    # Shallow clones may not have the last release's commit; fetch full
    # history and tags so the checks below can see it.
    - git fetch --unshallow --tags 2>/dev/null || git fetch --tags

    - |
      if [ -z "$CI_COMMIT_TAG" ] && git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
        echo "Tag $VERSION already exists -- bump versionName in app/build.gradle first." >&2
        exit 1
      fi

    # Refuse to release unless versionCode grew since the last release tag,
    # so an app update is never silently skipped by the Android/F-Droid
    # update checker (which keys off versionCode, not versionName).
    - LAST_TAG=$(git tag --list --sort=-v:refname | grep -P '^\d+\.\d+\.\d+$' | grep -v -F "$VERSION" | head -1 || true)
    - |
      if [ -n "$LAST_TAG" ]; then
        LAST_VERSION_CODE=$(git show "$LAST_TAG:app/build.gradle" | grep -oP 'versionCode\s+\K\d+')
        echo "Previous release $LAST_TAG had versionCode=$LAST_VERSION_CODE"
        if [ "$VERSION_CODE" -le "$LAST_VERSION_CODE" ]; then
          echo "versionCode ($VERSION_CODE) must be greater than $LAST_TAG's ($LAST_VERSION_CODE) -- bump versionCode in app/build.gradle." >&2
          exit 1
        fi
      fi

    # Upload debug APK & checksum to Package Registry
    - |
      curl --fail --silent --show-error \
           --header "JOB-TOKEN: $CI_JOB_TOKEN" \
           --upload-file "$DEBUG_APK" \
           "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/letterbox/${VERSION}/app-debug.apk"
    - |
      curl --fail --silent --show-error \
           --header "JOB-TOKEN: $CI_JOB_TOKEN" \
           --upload-file SHA256SUMS.debug \
           "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/letterbox/${VERSION}/SHA256SUMS.debug"

    # Upload release unsigned APK & checksum to Package Registry
    - |
      curl --fail --silent --show-error \
           --header "JOB-TOKEN: $CI_JOB_TOKEN" \
           --upload-file "$RELEASE_APK" \
           "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/letterbox/${VERSION}/app-release-unsigned.apk"
    - |
      curl --fail --silent --show-error \
           --header "JOB-TOKEN: $CI_JOB_TOKEN" \
           --upload-file SHA256SUMS.release \
           "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/letterbox/${VERSION}/SHA256SUMS.release"

    # Combine checksums for release note
    - DEBUG_SHA=$(awk '{print $1}' SHA256SUMS.debug)
    - RELEASE_SHA=$(awk '{print $1}' SHA256SUMS.release)
    - DEBUG_APK_URL="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/letterbox/${VERSION}/app-debug.apk"
    - RELEASE_APK_URL="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/letterbox/${VERSION}/app-release-unsigned.apk"
    - DEBUG_SUMS_URL="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/letterbox/${VERSION}/SHA256SUMS.debug"
    - RELEASE_SUMS_URL="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/letterbox/${VERSION}/SHA256SUMS.release"

    - |
      cat > release-notes.md << NOTES
      ## LetterBox ${VERSION}

      A children's game to learn the letters of the alphabet.

      ### 🔐 Binary Transparency

      These APKs were built by GitLab CI directly from commit \`${CI_COMMIT_SHA}\`
      (pipeline [#${CI_PIPELINE_ID}](${CI_PROJECT_URL}/-/pipelines/${CI_PIPELINE_ID})).

      **Release APK (unsigned):**
      \`\`\`
      ${RELEASE_SHA}  app-release-unsigned.apk
      \`\`\`

      **Debug APK:**
      \`\`\`
      ${DEBUG_SHA}  app-debug.apk
      \`\`\`
      NOTES

    # --ref lets the Releases API create the tag itself when it doesn't
    # exist yet (the on-demand path); it's a harmless no-op on a tag
    # pipeline, where the tag already points at $CI_COMMIT_SHA.
    - |
      release-cli create \
        --name "LetterBox ${VERSION}" \
        --tag-name "${VERSION}" \
        --ref "${CI_COMMIT_SHA}" \
        --description release-notes.md \
        --assets-link "{\"name\":\"app-release-unsigned.apk\",\"url\":\"${RELEASE_APK_URL}\",\"link_type\":\"package\"}" \
        --assets-link "{\"name\":\"app-debug.apk\",\"url\":\"${DEBUG_APK_URL}\",\"link_type\":\"package\"}" \
        --assets-link "{\"name\":\"SHA256SUMS.release\",\"url\":\"${RELEASE_SUMS_URL}\",\"link_type\":\"other\"}" \
        --assets-link "{\"name\":\"SHA256SUMS.debug\",\"url\":\"${DEBUG_SUMS_URL}\",\"link_type\":\"other\"}"
