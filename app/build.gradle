plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
}

android {
    namespace 'ch.cryptobit.letterbox'

    compileSdk 34

    defaultConfig {
        applicationId "ch.cryptobit.letterbox"
        // getColor(android.R.color.black) requires API 23; that's our true minimum.
        minSdk 23
        targetSdk 34
        versionCode 7
        versionName "1.5.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            // Shrink (tree-shake dead code) but do NOT obfuscate —
            // this is Free Software and readable stack traces are more
            // valuable than making reverse engineering harder.
            shrinkResources true
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation libs.androidx.appcompat
    implementation libs.androidx.core.ktx
    implementation libs.androidx.constraintlayout
    testImplementation libs.junit
    androidTestImplementation libs.androidx.test.junit
    androidTestImplementation libs.androidx.espresso.core
}
